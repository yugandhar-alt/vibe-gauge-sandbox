<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Defusal Sandbox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #1e1e24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 4px solid #333;
            transition: all 0.3s ease;
        }
        .vibe-gauge {
            width: 100%;
            height: 25px;
            background: #333;
            border-radius: 12px;
            margin: 20px 0;
            overflow: hidden;
        }
        .gauge-fill {
            width: 50%;
            height: 100%;
            background: #ff9800;
            transition: width 0.5s ease, background-color 0.5s ease;
        }
        .customer-bubble {
            background: #2d2d38;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            background: #3a3a4a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #4a4a5a;
            transform: translateY(-2px);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .boom {
            font-size: 5rem;
            animation: explode 0.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameBox">
        <div class="stats">
            <div id="scoreDisplay">Score: 0</div>
            <div id="statusDisplay">Customer Anger</div>
        </div>
        
        <div class="vibe-gauge">
            <div class="gauge-fill" id="gauge"></div>
        </div>

        <div class="customer-bubble" id="customerSpeech">
            "Your system broke down and ruined my entire presentation! Fix it right now!!"
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- Buttons dynamically generated by JS -->
        </div>
    </div>

    <script>
        let score = 0;
        let angerLevel = 50; // Starts at 50%
        let currentScenario = 0;

        const scenarios = [
            {
                speech: '"Your system broke down and ruined my entire presentation! Fix it right now!!"',
                options: [
                    { text: "I understand your frustration. Let's get this resolved immediately.", correct: true },
                    { text: "Calm down, it's just a presentation. Systems fail all the time.", correct: false }
                ]
            },
            {
                speech: '"I demand a full refund right now, or I am leaving a 1-star review on every platform!"',
                options: [
                    { text: "Go right ahead, threats won't speed up our processing timeline.", correct: false },
                    { text: "I can absolutely look up your billing terms right now to check your refund options.", correct: true }
                ]
            },
            {
                speech: '"You people are entirely incompetent! Why can\'t anyone give me a straight answer?!"',
                options: [
                    { text: "I am taking ownership of this right now so you don't have to keep repeating yourself.", correct: true },
                    { text: "If you let me speak without interrupting, I could give you an answer.", correct: false }
                ]
            }
        ];

        function loadScenario() {
            if (angerLevel >= 100) {
                triggerBoom();
                return;
            }
            if (angerLevel <= 0) {
                triggerWin();
                return;
            }

            // Pick a scenario loop
            let s = scenarios[currentScenario % scenarios.length];
            document.getElementById('customerSpeech').innerText = s.speech;
            
            let container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            s.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(opt.correct);
                container.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect) {
            let gameBox = document.getElementById('gameBox');
            let gauge = document.getElementById('gauge');

            if (isCorrect) {
                score += 100;
                angerLevel -= 25;
                gameBox.style.borderColor = "#4caf50"; // Turn Green
                gauge.style.backgroundColor = "#4caf50";
            } else {
                angerLevel += 35;
                gameBox.style.borderColor = "#f44336"; // Turn Red
                gauge.style.backgroundColor = "#f44336";
            }

            // Keep anger limits between 0 and 100
            angerLevel = Math.max(0, Math.min(100, angerLevel));
            gauge.style.width = angerLevel + "%";
            document.getElementById('scoreDisplay').innerText = "Score: " + score;

            if (angerLevel >= 100) {
                setTimeout(triggerBoom, 500);
            } else if (angerLevel <= 0) {
                setTimeout(triggerWin, 500);
            } else {
                currentScenario++;
                setTimeout(() => {
                    gameBox.style.borderColor = "#333"; // Reset color framework
                    loadScenario();
                }, 800);
            }
        }

        function triggerBoom() {
            document.getElementById('gameBox').innerHTML = `
                <div class="boom">💥 BOOM!</div>
                <h2>The Customer Exploded!</h2>
                <p>Final Score: ${score}</p>
                <button onclick="window.location.reload()" style="text-align:center; width:100%">Try Again</button>
            `;
            document.getElementById('gameBox').style.borderColor = "#f44336";
        }

        function triggerWin() {
            document.getElementById('gameBox').innerHTML = `
                <div class="boom">🎉 CALMED!</div>
                <h2>Crisis Defused Successfully!</h2>
                <p>Excellent emotional handling. Final Score: ${score}</p>
                <button onclick="window.location.reload()" style="text-align:center; width:100%">Play Again</button>
            `;
            document.getElementById('gameBox').style.borderColor = "#4caf50";
        }

        // Start Game
        loadScenario();
    </script>
</body>
</html>
